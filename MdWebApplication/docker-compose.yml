version: "3.9"

services:
  mdwebapplication:
    image: mdwebapplication
    build:
      context: .
      dockerfile: MdWebApplication/Dockerfile
    environment:
      MinIO__Endpoint:
      MinIO__AccessKey:
      MinIO__SecretKey:
      ConnectionStrings__AppDbContext:
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:latest
    container_name: postgres1
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio
    container_name: minio2
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:
      MINIO_ROOT_PASSWORD:
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
