<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <!-- Подключение CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material.min.css">
    <!-- Подключение CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
</head>
<body>
<h1>Markdown to HTML Converter</h1>
<button onclick="location.href='/login'" style="margin-top: 20px;">Go to Login/Registration</button>
<div style="display: flex; gap: 20px;">
    <!-- Markdown редактор -->
    <div style="flex: 1;">
        <h2>Markdown Input</h2>
        <textarea id="markdown-editor"></textarea>
    </div>
    <!-- HTML редактор -->
    <div style="flex: 1;">
        <h2>HTML Output</h2>
        <textarea id="html-editor"></textarea>
    </div>
</div>

<div>
    <h2>Save Markdown to Storage</h2>
    <form id="save-form">
        <input type="text" id="save-file-name" placeholder="Enter file name" required style="margin-right: 10px;">
        <button type="submit" style="margin-top: 10px;">Save Document</button>
    </form>
</div>

<div>
    <input type="text" id="file-name-input" placeholder="Enter file name" style="margin-right: 10px;">
    <button id="download-btn" style="margin-top: 20px;">Download Document</button>
</div>

<script src="/js/index-js.js"></script>
</body>
</html>
