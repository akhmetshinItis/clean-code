<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <!-- Подключение CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material.min.css">
    <!-- Подключение CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
</head>
<body>
<h1>Markdown to HTML Converter</h1>
<button onclick="location.href='/login'" style="margin-top: 20px;">Go to Login/Registration</button>
<div style="display: flex; gap: 20px;">
    <!-- Markdown редактор -->
    <div style="flex: 1;">
        <h2>Markdown Input</h2>
        <textarea id="markdown-editor"></textarea>
    </div>
    <!-- HTML редактор -->
    <div style="flex: 1;">
        <h2>HTML Output</h2>
        <textarea id="html-editor"></textarea>
    </div>
</div>

<script>
    // Инициализация CodeMirror для Markdown
    const markdownEditor = CodeMirror.fromTextArea(document.getElementById("markdown-editor"), {
        mode: "markdown",
        lineNumbers: true,
        theme: "material",
    });

    // Инициализация CodeMirror для HTML
    const htmlEditor = CodeMirror.fromTextArea(document.getElementById("html-editor"), {
        mode: "xml",
        lineNumbers: true,
        readOnly: true,
        theme: "material",
    });

    // Функция для автоматической конвертации Markdown в HTML
    markdownEditor.on("change", async () => {
        const markdownInput = markdownEditor.getValue(); // Получаем содержимое Markdown редактора
        try {
            const response = await fetch('/api/Md/convert', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ markdown: markdownInput }),
            });

            if (response.ok) {
                const data = await response.json();
                htmlEditor.setValue(data.html); // Устанавливаем результат в HTML редактор
            } else {
                const error = await response.json();
                console.error('Error:', error.error);
            }
        } catch (err) {
            console.error('Failed to convert Markdown:', err);
        }
    });
</script>
</body>
</html>
